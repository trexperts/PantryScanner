<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Scan</title>
<link rel="stylesheet" href="shared.css">
<style>
.mode-tabs{display:flex;gap:8px;margin-bottom:1.25rem}
.mode-tab{flex:1;padding:9px 0;border-radius:8px;border:.5px solid var(--border);background:var(--bg2);color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;text-align:center}
.mode-tab.active{border:1.5px solid var(--blue-border);background:var(--blue-bg);color:var(--blue-text);font-weight:500}

#video-wrap{background:#000;border-radius:12px;overflow:hidden;height:260px;position:relative;margin-bottom:1rem}
#video,#snap-canvas{width:100%;height:100%;object-fit:cover;display:block}
.viewfinder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.viewfinder-rect{border:2px solid rgba(255,255,255,.7);border-radius:8px;width:260px;height:170px}

#scan-status{font-size:13px;color:var(--text2);text-align:center;margin-bottom:1rem;min-height:18px}

.capture-btn{width:100%;padding:11px;border-radius:10px;border:.5px solid var(--blue-border);background:var(--blue-bg);color:var(--blue-text);font-size:14px;cursor:pointer;font-family:inherit;margin-bottom:1rem;display:none}

.matches{margin-bottom:1rem;display:none}
.match-btn{width:100%;padding:9px 10px;border-radius:8px;border:.5px solid var(--border);background:var(--bg2);color:var(--text);font-size:13px;cursor:pointer;text-align:left;margin-bottom:6px;font-family:inherit;display:flex;align-items:center;gap:8px}
.match-thumb{width:32px;height:32px;border-radius:5px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.match-label{flex:1;text-align:left}

.divider{font-size:12px;color:var(--text3);margin-bottom:8px;margin-top:.25rem}
.manual-row{display:flex;gap:8px}
.manual-input{flex:1;padding:8px 12px;border-radius:8px;border:.5px solid var(--border);background:var(--bg2);color:var(--text);font-size:14px;font-family:inherit}
.manual-btn{padding:8px 16px;border-radius:8px;border:.5px solid var(--border);background:var(--bg2);cursor:pointer;font-size:14px;color:var(--text);font-family:inherit}
.hint{font-size:11px;color:var(--text3);margin-top:8px;line-height:1.4}
</style>
</head>
<body>

<div class="page-header">
  <span class="page-title">▥ Scan</span>
</div>
<div class="page-sub" id="item-count">Loading…</div>

<div id="sync-status" class="alert info" style="display:none"></div>
<div id="scan-feedback" class="alert success" style="display:none"></div>

<!-- Mode switcher -->
<div class="mode-tabs">
  <button class="mode-tab" id="tab-barcode" onclick="setMode('barcode')">▥ Barcode</button>
  <button class="mode-tab" id="tab-photo"   onclick="setMode('photo')">📷 Label</button>
</div>

<!-- Camera -->
<div id="video-wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="snap-canvas" style="display:none"></canvas>
  <div class="viewfinder" id="viewfinder"><div class="viewfinder-rect"></div></div>
</div>

<div id="scan-status">Starting camera…</div>
<button id="capture-btn" class="capture-btn" onclick="captureAndSearchLabel()">📷 Read Label</button>

<!-- Product matches -->
<div id="matches" class="matches"></div>

<!-- Manual entry -->
<div class="divider">Or type a product name:</div>
<div class="manual-row">
  <input class="manual-input" id="manual-input" placeholder="e.g. Heinz Baked Beans" onkeydown="if(event.key==='Enter')manualAdd()">
  <button class="manual-btn" onclick="manualAdd()">Add</button>
</div>
<div class="hint">Tip: barcode mode is the most accurate. Label mode uses OCR + Open Food Facts.</div>

<nav id="bottom-nav"></nav>

<script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="shared.js"></script>
<script>
let scanMode = "barcode";
let stream = null;
let codeReader = null;

function onPantrySwitch() {
  document.getElementById("item-count").textContent = currentPantry.name + " — " + pantry.length + " items";
}

// ── Mode ───────────────────────────────────────────────────────────────────
function setMode(mode) {
  scanMode = mode;
  document.getElementById("tab-barcode").classList.toggle("active", mode === "barcode");
  document.getElementById("tab-photo").classList.toggle("active", mode === "photo");

  const captureBtn = document.getElementById("capture-btn");
  document.getElementById("matches").style.display = "none";
  document.getElementById("matches").innerHTML = "";
  document.getElementById("snap-canvas").style.display = "none";
  document.getElementById("video").style.display = "block";
  document.getElementById("viewfinder").style.display = "flex";

  stopCamera();
  if (codeReader) { try { codeReader.reset(); } catch(e){} codeReader = null; }

  if (mode === "photo") {
    captureBtn.style.display = "block";
    captureBtn.disabled = false;
    captureBtn.textContent = "📷 Read Label";
    captureBtn.onclick = captureAndSearchLabel;
    setStatus("Point camera at the product label and tap Read Label");
  } else {
    captureBtn.style.display = "none";
    setStatus("Point camera at a barcode");
  }

  if (location.protocol === "file:") {
    setStatus("Camera blocked: open via HTTPS for this to work on mobile.");
    return;
  }
  startCamera(mode);
}

// ── Camera ─────────────────────────────────────────────────────────────────
function startCamera(mode) {
  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } })
    .then(s => {
      stream = s;
      document.getElementById("video").srcObject = s;
      if (mode === "barcode") startBarcodeDecoding();
    })
    .catch(() => setStatus("Camera unavailable. Use manual entry below."));
}

function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

function startBarcodeDecoding() {
  if (typeof ZXing === "undefined") { setTimeout(startBarcodeDecoding, 500); return; }
  try {
    codeReader = new ZXing.BrowserMultiFormatReader();
    codeReader.decodeFromVideoDevice(null, "video", (result, err) => {
      if (result) handleBarcodeResult(result.getText());
    });
  } catch(e) { setStatus("Barcode scanner unavailable. Use manual entry."); }
}

// ── Barcode ────────────────────────────────────────────────────────────────
async function handleBarcodeResult(code) {
  stopCamera();
  if (codeReader) { try { codeReader.reset(); } catch(e){} codeReader = null; }
  setStatus("Looking up barcode…");

  const result = await lookupBarcode(code);
  if (result && result.name) {
    await commitItem(result.name, code, result.image);
  } else {
    const label = prompt("Product not found for barcode " + code + "\nEnter product name:");
    if (label) await commitItem(label, code, null);
    else setMode(scanMode); // restart
  }
}

// ── Label (OCR) ────────────────────────────────────────────────────────────
async function captureAndSearchLabel() {
  const video = document.getElementById("video");
  const canvas = document.getElementById("snap-canvas");
  const btn = document.getElementById("capture-btn");

  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);

  document.getElementById("video").style.display = "none";
  document.getElementById("viewfinder").style.display = "none";
  canvas.style.display = "block";
  stopCamera();

  btn.disabled = true;
  btn.textContent = "Reading label…";
  setStatus("Reading product text from image…");

  const matches = document.getElementById("matches");
  matches.style.display = "none";
  matches.innerHTML = "";

  try {
    const result = await Tesseract.recognize(canvas, "eng");
    const query = buildProductSearchQuery(result?.data?.text || "");

    if (!query) {
      setStatus("Could not read enough text. Try manual entry below.");
      resetCaptureBtn();
      return;
    }

    setStatus("Searching: " + query);
    const products = await searchOpenFoodFacts(query);

    if (!products.length) {
      setStatus("No match found. Try manual entry below.");
      resetCaptureBtn();
      return;
    }

    setStatus("Choose the best match:");
    matches.style.display = "block";
    matches.innerHTML = products.slice(0, 5).map(p => {
      const name = cleanProductName(p.product_name || p.product_name_en || p.generic_name || "Unknown");
      const brand = cleanProductName(p.brands || "");
      const label = brand && !name.toLowerCase().includes(brand.toLowerCase()) ? `${brand} ${name}` : name;
      const image = p.image_front_small_url || p.image_front_url || p.image_small_url || p.image_url || null;
      const imgHtml = image
        ? `<img class="match-thumb" src="${escapeHtml(image)}" alt="" onerror="this.style.display='none'">`
        : `<div class="match-thumb" style="display:flex;align-items:center;justify-content:center;font-size:16px">🥫</div>`;
      return `<button class="match-btn" onclick="commitItem('${escapeJs(label)}','','${escapeJs(image||'')}')">
        ${imgHtml}<span class="match-label">${escapeHtml(label)}</span>
      </button>`;
    }).join("");

    resetCaptureBtn("📷 Try Again");
  } catch(e) {
    setStatus("Error reading label. Try manual entry below.");
    resetCaptureBtn("📷 Try Again");
  }
}

function resetCaptureBtn(text) {
  const btn = document.getElementById("capture-btn");
  btn.disabled = false;
  btn.textContent = text || "📷 Try Again";
  btn.onclick = () => {
    document.getElementById("snap-canvas").style.display = "none";
    document.getElementById("video").style.display = "block";
    document.getElementById("viewfinder").style.display = "flex";
    document.getElementById("matches").style.display = "none";
    document.getElementById("matches").innerHTML = "";
    setStatus("Point camera at the product label and tap Read Label");
    btn.onclick = captureAndSearchLabel;
    startCamera("photo");
  };
}

// ── Manual entry ───────────────────────────────────────────────────────────
async function manualAdd() {
  const v = document.getElementById("manual-input").value.trim();
  if (!v) return;
  document.getElementById("manual-input").value = "";
  await commitItem(v, "", null);
}

// ── Commit item + return to pantry ─────────────────────────────────────────
async function commitItem(name, barcode, image) {
  addOrIncrementItem(name, barcode, image || null);
  await saveItems();
  sessionStorage.setItem("added_item", name);
  window.location.href = "index.html";
}

function setStatus(msg) {
  document.getElementById("scan-status").textContent = msg;
}

// ── Boot ───────────────────────────────────────────────────────────────────
renderNav("scanner.html");

// Read ?mode= param
const urlMode = new URLSearchParams(location.search).get("mode") || "barcode";

loadPantries(() => {
  document.getElementById("item-count").textContent = currentPantry.name + " — " + pantry.length + " items";
  setMode(urlMode);
});
</script>
</body>
</html>
