<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pantry</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>

<div class="page-header">
  <span class="page-title">🥫 Pantry</span>
</div>

<!-- Pantry selector -->
<div class="selector-row">
  <select id="pantry-select" onchange="switchPantry(this.value)"></select>
  <button onclick="addNewPantry()">+ New</button>
  <button onclick="deleteCurrentPantry()">Delete</button>
</div>

<div class="page-sub" id="item-count">Loading…</div>
<div id="sync-status" class="alert info" style="display:none"></div>
<div id="low-alert" class="alert warn" style="display:none"></div>
<div id="scan-feedback" class="alert success" style="display:none"></div>

<!-- Scan shortcuts -->
<div style="display:flex;gap:8px;margin-bottom:1rem">
  <a href="scanner.html?mode=barcode" class="scan-btn" style="flex:1;text-decoration:none">▥ Scan Barcode</a>
  <a href="scanner.html?mode=photo" class="scan-btn" style="flex:1;text-decoration:none">📷 Scan Label</a>
</div>

<!-- Item list -->
<div id="pantry-list"></div>

<!-- Item detail sheet (image editor) -->
<div id="item-detail-overlay" onclick="handleDetailOverlayClick(event)">
  <div class="item-detail-sheet">
    <div class="detail-handle"></div>
    <div class="detail-header">
      <div class="detail-item-name" id="detail-item-name"></div>
      <button class="detail-close" onclick="closeItemDetail()">×</button>
    </div>
    <div class="detail-image-area" onclick="document.getElementById('detail-file-input').click()">
      <div id="detail-image-content"></div>
      <div class="detail-image-overlay"><span class="detail-image-overlay-label">📷 Change photo</span></div>
    </div>
    <input type="file" id="detail-file-input" accept="image/*" onchange="handleDetailFileUpload(event)">
    <div style="margin-bottom:.75rem">
      <div class="detail-section-label">Upload from device</div>
      <button class="detail-upload-btn" onclick="document.getElementById('detail-file-input').click()">📂 Choose Photo</button>
    </div>
    <div style="margin-bottom:1rem">
      <div class="detail-section-label">Or paste an image URL</div>
      <div class="detail-url-row">
        <input class="detail-url-input" id="detail-url-input" placeholder="https://…" type="url">
        <button class="detail-url-btn" onclick="applyDetailUrl()">Set</button>
      </div>
    </div>
    <button class="detail-remove-btn" id="detail-remove-btn" onclick="removeDetailImage()">Remove image</button>
  </div>
</div>

<nav id="bottom-nav"></nav>

<script src="shared.js"></script>
<script>
// Called by shared.js after pantry data changes
function onPantrySwitch() {
  renderPantrySelector("pantry-select");
  render();
}

function render() {
  document.getElementById("item-count").textContent = currentPantry.name + " — " + pantry.length + " items";

  const low = pantry.filter(i => i.qty <= LOW);
  const la = document.getElementById("low-alert");
  if (low.length) {
    la.style.display = "block";
    la.innerHTML = "<strong>Running low:</strong> " + low.map(i => escapeHtml(i.name)).join(", ");
  } else la.style.display = "none";

  const list = document.getElementById("pantry-list");
  if (!pantry.length) {
    list.innerHTML = '<div class="empty">No items yet. Tap Scan to add your first item.</div>';
    return;
  }
  list.innerHTML = pantry.map(item => `
    <div class="item${item.qty <= LOW ? " low" : ""}">
      <div style="display:flex;align-items:center;gap:12px;flex:1;cursor:pointer;min-width:0;overflow:hidden" onclick="openItemDetail(${item.id})">
        ${itemThumbHtml(item)}
        <div style="flex:1;min-width:0">
          <div class="item-name">${escapeHtml(item.name)}</div>
          ${item.qty <= LOW ? '<div class="low-label">Low stock</div>' : ""}
        </div>
      </div>
      <button class="qty-btn" onclick="updateQty(${item.id},-1)">−</button>
      <span class="qty">${item.qty}</span>
      <button class="qty-btn" onclick="updateQty(${item.id},1)">+</button>
      <button class="del-btn" onclick="removeItem(${item.id})">✕</button>
    </div>`).join("");
}

async function updateQty(id, d) {
  pantry = pantry.map(i => i.id === id ? { ...i, qty: i.qty + d } : i).filter(i => i.qty > 0);
  render();
  await saveItems();
}

async function removeItem(id) {
  pantry = pantry.filter(i => i.id !== id);
  render();
  await saveItems();
}

// ── Item detail (image editor) ─────────────────────────────────────────────
let detailItemId = null;

function openItemDetail(id) {
  const item = pantry.find(i => i.id === id);
  if (!item) return;
  detailItemId = id;
  document.getElementById("detail-item-name").textContent = item.name;
  document.getElementById("detail-url-input").value = item.image || "";
  renderDetailImage(item.image);
  document.getElementById("item-detail-overlay").classList.add("open");
}

function renderDetailImage(url) {
  const area = document.getElementById("detail-image-content");
  const removeBtn = document.getElementById("detail-remove-btn");
  if (url) {
    area.innerHTML = `<img src="${escapeHtml(url)}" style="width:100%;height:100%;object-fit:cover;display:block;border-radius:12px" onerror="this.parentElement.innerHTML='<div class=detail-image-placeholder>🥫</div>'">`;
    removeBtn.style.display = "block";
  } else {
    area.innerHTML = `<div class="detail-image-placeholder">🥫</div>`;
    removeBtn.style.display = "none";
  }
}

function closeItemDetail() {
  document.getElementById("item-detail-overlay").classList.remove("open");
  detailItemId = null;
}

function handleDetailOverlayClick(e) {
  if (e.target === document.getElementById("item-detail-overlay")) closeItemDetail();
}

function handleDetailFileUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => { await setDetailImage(ev.target.result); };
  reader.readAsDataURL(file);
  e.target.value = "";
}

async function applyDetailUrl() {
  const url = document.getElementById("detail-url-input").value.trim();
  if (!url) return;
  await setDetailImage(url);
}

async function setDetailImage(url) {
  if (detailItemId === null) return;
  pantry = pantry.map(i => i.id === detailItemId ? { ...i, image: url } : i);
  renderDetailImage(url);
  document.getElementById("detail-url-input").value = url.startsWith("data:") ? "" : url;
  render();
  await saveItems();
  showFeedback("Image saved!");
}

async function removeDetailImage() {
  if (detailItemId === null) return;
  pantry = pantry.map(i => i.id === detailItemId ? { ...i, image: null } : i);
  renderDetailImage(null);
  document.getElementById("detail-url-input").value = "";
  render();
  await saveItems();
  showFeedback("Image removed");
}

// ── Boot ───────────────────────────────────────────────────────────────────
renderNav("index.html");
loadPantries(() => {
  renderPantrySelector("pantry-select");
  render();

  // If scanner.html saved a new item, show feedback
  const added = sessionStorage.getItem("added_item");
  if (added) { showFeedback("Added: " + added); sessionStorage.removeItem("added_item"); }
});
</script>
</body>
</html>
